name: Daily Market Data Ingest

on:
  schedule:
    # KST 16:00 = UTC 07:00, 월~금 (미장 종가 후 — 미국 동부 03:00 EST)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # 수동 트리거 허용

permissions:
  contents: write  # _runs/ JSON 자동 commit·push 권한

env:
  # 2026-06-02부터 GitHub Actions가 Node.js 24 강제 전환 → 미리 opt-in
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install M1 minimal dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "yfinance>=0.2.40" \
            "duckdb>=1.0.0" \
            "pandas>=2.2.0" \
            "structlog>=24.4.0" \
            "pyyaml>=6.0.2" \
            "pydantic-settings>=2.5.0" \
            "python-dotenv>=1.0.1"

      - name: Restore DuckDB cache (시계열 누적 보존)
        uses: actions/cache@v4
        with:
          path: data/finance.duckdb
          key: duckdb-data-${{ github.run_id }}
          restore-keys: |
            duckdb-data-

      - name: Initialize DuckDB schema (멱등)
        run: python scripts/init_db.py

      - name: Run daily ingest
        run: python scripts/ingest_daily.py --period 1mo

      - name: Commit run summary (잔디 자동화)
        run: |
          git config user.name "RL9-csv"
          git config user.email "shootingstar23@naver.com"
          git add data/_runs/
          if git diff --cached --quiet; then
            echo "No new run summary to commit."
          else
            git commit -m "chore(ingest): daily run summary $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: echo "ingest failed - Slack/Telegram 알림 추가 예정"
